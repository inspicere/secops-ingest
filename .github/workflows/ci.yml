name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately BEFORE the dev install: this must pass with nothing but the
      # standard library present. It is the executable form of the project's
      # central claim, so if it regresses the README has become untrue.
      - name: Core imports with no third-party dependency
        run: |
          pip install --no-deps -e .
          python -c "
          from secops_ingest.secrets import get_provider, available_backends
          assert set(available_backends()) >= {'env', 'file'}, available_backends()
          get_provider('env')
          print('core OK:', available_backends())
          "

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest -q --cov=secops_ingest --cov-report=term-missing

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Connectors talk to per-tenant endpoints. A hardcoded address makes the
      # package usable by exactly one organisation, and is how internal detail
      # reaches a public repository. Keeping it mechanical beats remembering.
      - name: No private addresses or non-reserved hostnames
        run: |
          # Full dotted quads in private ranges only. A looser pattern matches
          # version strings such as 0.58.8.4 and cries wolf until it is ignored.
          if grep -rnE \
            '\b(192\.168|10|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\.?[0-9]{0,3}\b' \
            src tests --include='*.py'; then
            echo "::error::Private address in source. Endpoints belong in configuration."
            exit 1
          fi
          # example.com / example.org / .example are reserved by RFC 2606 for
          # exactly this. Anything else in a test fixture is somebody's real host.
          #
          # Loopback is allowed: 127.0.0.1 and localhost are provably nobody's
          # infrastructure, and they are the correct thing to write in a local
          # integration test. Flagging them made this job fail on a change that
          # leaked nothing -- and a check that cries wolf is one people learn to
          # ignore, which costs more than it ever catches.
          if grep -rnoE 'https?://[A-Za-z0-9.-]+' src tests --include='*.py' \
             | grep -vE '(example\.(com|org|net)|//api\.example|apache\.org|python\.org|//127\.0\.0\.1|//localhost)'; then
            echo "::error::Non-reserved hostname. Use example.com (RFC 2606)."
            exit 1
          fi
          echo "hygiene clean"

  # The pluggable-backend claim, demonstrated rather than asserted.
  #
  # OpenBao is the MPL-2.0 fork of Vault's last open-source branch, under Linux
  # Foundation governance, and keeps Vault's HTTP API. Testing against it proves
  # two things at once: the provider works with a real server, and it does so
  # with nothing proprietary anywhere in the job. HashiCorp Vault moved to BUSL
  # in 2023, so it could not play this role.
  openbao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start OpenBao
        run: |
          docker run -d --name openbao -p 8200:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID=root \
            -e BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            quay.io/openbao/openbao:latest server -dev
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1 && break
            sleep 1
          done
          # Fail here rather than letting the tests skip: VAULT_ADDR is set in
          # the next step regardless, so a server that never came up would
          # otherwise surface as a confusing collection errors instead of
          # "the backend is down".
          if ! curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null; then
            echo "::error::OpenBao did not become healthy"
            docker logs openbao
            exit 1
          fi
          echo "server reports:"
          curl -sf http://127.0.0.1:8200/v1/sys/health

      - name: Install with the vault extra
        run: pip install -e ".[vault,dev]"

      - name: Vault provider resolves secrets from OpenBao
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: pytest tests/secrets/test_vault_backend_integration.py -v

      - name: OpenBao logs
        if: failure()
        run: docker logs openbao
