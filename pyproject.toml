[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secops-ingest"
version = "0.1.0"
description = "Pull security-vendor telemetry into PostgreSQL, with pluggable secret backends"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Core has NO third-party dependencies. Everything below is opt-in, so a
# default install pulls in nothing proprietary.
dependencies = []

[project.optional-dependencies]
delinea = ["python-tss-sdk>=1.2"]
vault = ["hvac>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
http = ["httpx>=0.27", "tenacity>=8.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

# Third-party backends register here and are discovered without a fork.
[project.entry-points."secops_ingest.secret_providers"]
delinea = "secops_ingest.secrets.delinea:DelineaSecretProvider"
vault = "secops_ingest.secrets.vault:VaultSecretProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: importable without an editable install, so CI needs no build step
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
